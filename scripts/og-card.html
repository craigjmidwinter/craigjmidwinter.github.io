<!doctype html>
<!--
  Source for public/og-default.png, the site-wide social card (1200x630).
  Blog posts override it with their own cover_image; this is the fallback.

  Regenerate from the repo root by screenshotting this file in headless Chrome at
  1200x630 with a device scale factor of 1, then writing the result to
  public/og-default.png. Give it a virtual-time budget of a few seconds so the
  Google Fonts request resolves — without that the card renders in a fallback
  face. Colours here mirror the Jazz tokens documented in the README.
-->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#fbfaf7;
       font-family:'Space Grotesk',sans-serif;position:relative}
  .slab{position:absolute;left:-10%;top:-20%;width:130%;height:88%;
        background:#111;transform:rotate(-7deg);transform-origin:left bottom}
  .mark{position:absolute}
  .head{position:absolute;left:64px;top:44px;z-index:3;
        font-weight:700;font-size:88px;line-height:0.86;letter-spacing:-0.05em;
        text-transform:uppercase;color:#fbfaf7}
  .card{position:absolute;left:64px;bottom:56px;z-index:4;background:#fbfaf7;
        padding:26px 30px;box-shadow:14px 14px 0 #00a7a0;max-width:760px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:15px;
           letter-spacing:.16em;color:#8e3d94;margin-bottom:12px}
  .name{font-weight:700;font-size:44px;letter-spacing:-0.04em;color:#111;line-height:1}
  .role{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:16px;
        letter-spacing:.1em;color:#111;margin-top:14px;opacity:.75}
  .url{position:absolute;right:64px;bottom:74px;z-index:4;
       font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;
       letter-spacing:.16em;color:#111;background:#e9e64a;padding:14px 18px}
</style></head><body>
  <div class="slab"></div>
  <!-- confetti, same clip-path family as the site marks -->
  <div class="mark" style="left:842px;top:74px;width:74px;height:74px;background:#00a7a0;border-radius:50%"></div>
  <div class="mark" style="left:958px;top:186px;width:64px;height:64px;background:#e9e64a;transform:rotate(18deg)"></div>
  <div class="mark" style="left:1074px;top:60px;width:60px;height:60px;background:#8e3d94;clip-path:polygon(50% 0,100% 100%,0 100%)"></div>
  <div class="mark" style="left:900px;top:300px;width:52px;height:52px;background:#8e3d94;border-radius:44px 44px 0 0"></div>
  <div class="head">Engineering<br>Leader,<br>Still Shipping.</div>
  <!--
    Deliberately no job title. A title baked into a raster cannot be corrected by
    editing text, so it misstates someone's employment silently for as long as
    nobody looks. The name and the mark are what a social card needs; the headline
    below is Craig's own H1, not a claim assembled here.
  -->
  <div class="card">
    <div class="eyebrow">MIDWINTER.IO · WINNIPEG</div>
    <div class="name">Craig Midwinter</div>
  </div>
  <div class="url">MIDWINTER.IO</div>
</body></html>
